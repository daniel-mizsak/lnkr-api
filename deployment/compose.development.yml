---
services:
  database-migrations:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.development
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bash", "scripts/run-database-migrations.sh"]
    environment:
      POSTGRES_HOST: "${POSTGRES_HOST}"
      POSTGRES_USERNAME: "${POSTGRES_USERNAME}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DATABASE: "${POSTGRES_DATABASE}"

  lnkr-api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.development
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    develop:
      watch:
        - path: ../src
          action: sync
          target: /app/src
        - path: ../templates
          action: sync
          target: /app/templates
        - path: ../pyproject.toml
          action: rebuild
    volumes:
      - "../alembic/versions:/app/alembic/versions"
      - "../geoip:/app/geoip:ro"
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: "${ENVIRONMENT}"
      ACCESS_TOKEN_SECRET_KEY: "${ACCESS_TOKEN_SECRET_KEY}"
      FRONTEND_API_KEY: "${FRONTEND_API_KEY}"

      POSTGRES_HOST: "${POSTGRES_HOST}"
      POSTGRES_USERNAME: "${POSTGRES_USERNAME}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DATABASE: "${POSTGRES_DATABASE}"

      REDIS_HOST: "${REDIS_HOST}"
      REDIS_USERNAME: "${REDIS_USERNAME}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"

      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"

  postgres:
    image: "${POSTGRES_IMAGE}"
    container_name: postgres
    user: postgres
    shm_size: "256mb"
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "--host=localhost",
          "--username=${POSTGRES_USERNAME}",
          "--dbname=${POSTGRES_DATABASE}",
        ]
      interval: 1s
      timeout: 5s
      retries: 10
      start_period: 5s
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

  adminer:
    image: adminer:5.4.2
    container_name: adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: "postgres"

  redis:
    image: "${REDIS_IMAGE}"
    container_name: redis
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"

  mailpit:
    image: axllent/mailpit:v1.29.7
    container_name: mailpit
    ports:
      - "8025:8025"
    command:
      - --smtp-auth-allow-insecure
    environment:
      MP_SMTP_AUTH: "${SMTP_USER}:${SMTP_PASSWORD}"
