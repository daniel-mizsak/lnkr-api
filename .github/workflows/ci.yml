---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 12 * * 6" # Every Saturday at 12:00
  workflow_call: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    permissions:
      contents: read
    uses: daniel-mizsak/workflows/.github/workflows/prek.yml@cf0f188aa237b6995b21cc0237897ff8bfe2da5b # v3.0.1

  lint:
    permissions:
      contents: read
      pull-requests: write
    uses: daniel-mizsak/workflows/.github/workflows/lint-cupcake.yml@cf0f188aa237b6995b21cc0237897ff8bfe2da5b # v3.0.1
    with:
      megalinter-config: "./.github/linters/.megalinter.yml"

  ci:
    permissions:
      contents: read
      id-token: write
    uses: daniel-mizsak/workflows/.github/workflows/python-ci.yml@cf0f188aa237b6995b21cc0237897ff8bfe2da5b # v3.0.1
    with:
      coverage: true
      codecov: true
