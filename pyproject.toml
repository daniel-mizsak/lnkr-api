# Build System
[build-system]
  requires = ["uv_build>=0.13,<0.14"]
  build-backend = "uv_build"

# Project Metadata
[project]
  name = "lnkr-api"
  version = "0.0.0"
  description = "Link manager REST API."
  authors = [{ name = "Daniel Mizsak", email = "daniel@mizsak.com" }]
  requires-python = ">=3.14"
  dependencies = [
    "PyJWT==2.13.0",
    "SQLAlchemy[asyncio]==2.1.6",
    "alembic[tz]==1.20.1",
    "anyio==4.15.1",
    "argon2-cffi==25.1.0",
    "fastapi[standard]==0.162.0",
    "geoip2==5.3.0",
    "httpx2==2.16.0",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.1",
    "redis==8.1.0",
    "segno==1.6.6",
    "sentry-sdk==2.73.0",
    "ua-parser[regex]==1.0.2",
  ]

  [project.urls]
    Homepage = "https://api.lnkr.by"
    Repository = "https://github.com/daniel-mizsak/lnkr-api"

[dependency-groups]
  dev = [
    { include-group = "lint" },
    "ansible-lint==26.10.1",
    "beautifulsoup4==4.15.0",
    "coverage==7.17.0",
    "fakeredis==2.40.0",
    "prek==0.5.7",
    "pytest-asyncio==1.4.0",
    "pytest==9.1.1",
    "testcontainers[postgres]==4.15.0",
    "ty==0.0.91",
  ]
  lint = ["ruff==0.17.2"]
  deployment = [
    "ansible==14.5.0",
    "pulumi==3.272.0",
    "pulumi-cloudflare==6.23.1",
  ]

# Tools
# Pytest
[tool.pytest.ini_options]
  asyncio_mode = "auto"
  testpaths = ["tests"]

# Uv
[tool.uv]
  exclude-newer = "1 week"

  [tool.uv.build-backend]
    module-root = "src"
    module-name = "lnkr"
